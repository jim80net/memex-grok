name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Build BEFORE tests: the launch-path guard (issue #3) spawns the bundled
      # binary and drives a real MCP initialize handshake. Without a prior build
      # that guard skips; here it must run, so the build step is mandatory and
      # ordered first. A broken build fails loudly on this step.
      - name: Build binary
        run: pnpm build

      - name: Test (unit + built-binary launch path)
        run: pnpm test
